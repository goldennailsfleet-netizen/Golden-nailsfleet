<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>

  <!-- Robot head -->
  <rect x="166" y="120" width="180" height="160" rx="32" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="256" y1="120" x2="256" y2="88" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="80" r="10" fill="url(#accent)"/>

  <!-- Eyes -->
  <rect x="196" y="168" width="44" height="32" rx="10" fill="url(#accent)" opacity="0.9"/>
  <rect x="272" y="168" width="44" height="32" rx="10" fill="url(#accent)" opacity="0.9"/>
  <circle cx="218" cy="184" r="8" fill="white"/>
  <circle cx="294" cy="184" r="8" fill="white"/>
  <circle cx="221" cy="181" r="4" fill="#0f0f1a"/>
  <circle cx="297" cy="181" r="4" fill="#0f0f1a"/>

  <!-- Mouth -->
  <rect x="206" y="228" width="100" height="14" rx="7" fill="url(#glow)" opacity="0.8"/>

  <!-- Body / Signal waves -->
  <rect x="196" y="310" width="120" height="12" rx="6" fill="url(#accent)" opacity="0.7"/>
  <rect x="216" y="334" width="80" height="12" rx="6" fill="url(#accent)" opacity="0.5"/>
  <rect x="236" y="358" width="40" height="12" rx="6" fill="url(#accent)" opacity="0.3"/>

  <!-- Side ears -->
  <rect x="140" y="168" width="26" height="46" rx="8" fill="url(#accent)" opacity="0.6"/>
  <rect x="346" y="168" width="26" height="46" rx="8" fill="url(#accent)" opacity="0.6"/>
</svg>
