name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
      - claude/ai-super-app-config-6c2ke7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ai-app edge function
        run: |
          supabase functions deploy ai-app \
            --project-ref xdkfvaeibaajdksalykp \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
